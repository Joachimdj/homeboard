# Homeboard services. Generated by scripts/gen_strings.py; names and descriptions live in strings.json.
create_issue:
  fields:
    project:
      required: true
      example: HOME
      selector:
        text: {}
    summary:
      required: true
      example: Battery low in the front door sensor
      selector:
        text: {}
    description:
      selector:
        text:
          multiline: true
    type:
      example: bug
      selector:
        select:
          options:
          - task
          - bug
          - story
          - epic
          mode: dropdown
          translation_key: issue_type
